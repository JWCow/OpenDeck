name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag version ($TAG_VER) does not match package.json version ($PKG_VER)"
            exit 1
          fi

      - name: Run static checks
        run: npm run check

      - name: Run E2E test suite
        run: npm test

      - name: Build release ZIPs
        run: npm run build:release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-virtual-deck-release
          path: dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/opendeck.zip
            dist/opendeck-latest.zip
            dist/opendeck-v*.zip
            dist/obs-virtual-deck.zip
            dist/obs-virtual-deck-latest.zip
            dist/obs-virtual-deck-v*.zip

  build-desktop:
    needs: build-and-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        run: npm --prefix electron ci

      - name: Build desktop installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix electron run build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendeck-desktop-${{ matrix.platform }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.AppImage
          if-no-files-found: error

  publish-desktop-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-release
      - build-desktop
    runs-on: ubuntu-24.04

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opendeck-desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Attach desktop binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-artifacts/*.exe
            desktop-artifacts/*.dmg
            desktop-artifacts/*.zip
            desktop-artifacts/*.AppImage
